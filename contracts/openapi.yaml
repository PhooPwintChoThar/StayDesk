openapi: 3.1.0
info:
  title: Hotel Guest and Reservation Service APIs
  version: 1.0.0
  description: |
    Service endpoints for room-rate, guest, billing, and reservation.
    Each service uses its own base URL.

paths:
  /login:
    post:
      operationId: login
      tags: [gateway]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Staff username or guest email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register:
    post:
      operationId: registerGuest
      tags: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRegistrationInput"
      responses:
        "201":
          description: Guest account created
          content:
            application/json:
              schema:
                type: object
                required: [guestId]
                properties:
                  guestId:
                    type: string
        "200":
          description: Password set for an existing booking profile without changing the profile
          content:
            application/json:
              schema:
                type: object
                required: [guestId]
                properties:
                  guestId:
                    type: string
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"

  /room-types:
    get:
      operationId: listRoomTypes
      tags: [room-rate]
      description: Public. Room types with their current nightly rate and number of rooms.
      responses:
        "200":
          description: Room types of the hotel
          content:
            application/json:
              schema:
                type: object
                required: [roomTypes]
                properties:
                  roomTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomType"
    post:
      operationId: createRoomType
      tags: [room-rate]
      description: Manager only. Creates a room type and its nightly rate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeInput"
      responses:
        "201":
          description: Created room type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /room-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRoomType
      tags: [room-rate]
      description: Manager only. Price changes apply to new bookings only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                maxOccupancy:
                  type: integer
                  minimum: 1
                nightlyRate:
                  type: number
      responses:
        "200":
          description: Updated room type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRoomType
      tags: [room-rate]
      description: Manager only. Refused (409) while rooms or bookings use the type.
      responses:
        "200":
          description: Deleted
        "409":
          $ref: "#/components/responses/Conflict"

  /rooms:
    get:
      operationId: listRooms
      tags: [room-rate]
      description: Agents and managers. Maintenance windows that have ended are cleared on read.
      responses:
        "200":
          description: All rooms
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [room-rate]
      description: Manager only. Pass either an existing roomTypeId or a newRoomType to create both in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomNumber]
              properties:
                roomNumber:
                  type: string
                roomTypeId:
                  type: string
                newRoomType:
                  $ref: "#/components/schemas/RoomTypeInput"
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRoom
      tags: [room-rate]
      description: Manager only. Changing the room type is refused while the room has upcoming reservations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomNumber:
                  type: string
                roomTypeId:
                  type: string
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteRoom
      tags: [room-rate]
      description: Manager only. Refused while the room has upcoming reservations.
      responses:
        "200":
          description: Deleted
        "409":
          $ref: "#/components/responses/Conflict"

  /rooms/{id}/maintenance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setRoomMaintenance
      tags: [room-rate]
      description: >
        Manager only. Puts the room out of service from `from` (inclusive) until `to`
        (the day it is back in service). Refused with 409 when any held or confirmed
        reservation on this room overlaps the period, or 400 when `from` is in the past.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        "200":
          description: Room under maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: endRoomMaintenance
      tags: [room-rate]
      description: Manager only. Returns the room to available.
      responses:
        "200":
          description: Room available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /availability:
    get:
      operationId: getAvailability
      tags: [room-rate]
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: roomTypeId
          in: query
          schema:
            type: string
        - name: guests
          in: query
          schema:
            type: integer
            minimum: 1
        - name: excludeHoldId
          in: query
          description: Optional hold id to exclude from availability counts during a modify flow.
          schema:
            type: string
      responses:
        "200":
          description: Available room types and rates
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability:
                    type: array
                    items:
                      $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"

  # Internal only: holds, deposits, refunds and /payments/reservations/* are not routed by the gateway.
  /holds:
    post:
      operationId: createRoomHold
      tags: [room-rate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, checkIn, checkOut]
              properties:
                roomTypeId:
                  type: string
                checkIn:
                  type: string
                  format: date
                checkOut:
                  type: string
                  format: date
                excludeHoldId:
                  type: string
      responses:
        "201":
          description: Room hold created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomHold"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /holds/{id}/confirm:
    post:
      operationId: confirmRoomHold
      tags: [room-rate]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Room hold confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomHold"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /holds/{id}:
    delete:
      operationId: releaseRoomHold
      tags: [room-rate]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Room hold released
        "404":
          $ref: "#/components/responses/NotFound"

  /guests/get-or-create:
    post:
      operationId: getOrCreateGuest
      tags: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "200":
          description: Existing guest returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "201":
          description: Guest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/BadRequest"

  /guests/search:
    get:
      operationId: searchGuests
      tags: [guest]
      parameters:
        - name: q
          in: query
          required: true
          description: Search by guest name or email
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching guests
          content:
            application/json:
              schema:
                type: object
                required: [guests]
                properties:
                  guests:
                    type: array
                    items:
                      $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/BadRequest"

  /guests/{id}:
    put:
      operationId: updateGuest
      tags: [guest]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "200":
          description: Guest updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /deposits:
    post:
      operationId: authorizeDeposit
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationNo, guestId, amount, currency]
              properties:
                reservationNo:
                  type: string
                guestId:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"
                idempotencyKey:
                  type: string
      responses:
        "201":
          description: Deposit authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositResult"
        "402":
          description: Deposit declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"

  /refunds:
    post:
      operationId: refundDeposit
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depositId, amount, currency]
              properties:
                depositId:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"
                idempotencyKey:
                  type: string
      responses:
        "201":
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservation]
      description: Guest requests are always filtered to the authenticated guest, regardless of supplied guest filters.
      parameters:
        - name: guestId
          in: query
          description: Staff-only filter; ignored and replaced for guests.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Reservations visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservation]
      description: The deposit is calculated as 30% of the total price in the availability currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest, roomTypeId, checkIn, checkOut]
              properties:
                guest:
                  $ref: "#/components/schemas/GuestInput"
                roomTypeId:
                  type: string
                checkIn:
                  type: string
                  format: date
                checkOut:
                  type: string
                  format: date
                guests:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          description: Deposit declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /reservations/{no}:
    parameters:
      - name: no
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getReservation
      tags: [reservation]
      responses:
        "200":
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateReservation
      tags: [reservation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, checkIn, checkOut]
              properties:
                roomTypeId:
                  type: string
                checkIn:
                  type: string
                  format: date
                checkOut:
                  type: string
                  format: date
                guests:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Reservation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: cancelReservation
      tags: [reservation]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                waiveFee:
                  type: boolean
                  description: Manager-only cancellation fee waiver.
      responses:
        "204":
          description: Reservation cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /reservations/{no}/payment-summary:
    get:
      operationId: getReservationPaymentSummary
      tags: [reservation]
      parameters:
        - name: no
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deposit and approved-proof balance summary
          content:
            application/json:
              schema:
                type: object
                required: [totalAmount, depositHeld, approvedProofsTotal, balanceDue, currency]
                properties:
                  totalAmount:
                    type: number
                  depositHeld:
                    type: number
                  approvedProofsTotal:
                    type: number
                  balanceDue:
                    type: number
                  currency:
                    type: string
                    pattern: "^[A-Z]{3}$"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reservations/{no}/cancellation-quote:
    get:
      operationId: getReservationCancellationQuote
      tags: [reservation]
      parameters:
        - name: no
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote for cancelling the reservation
          content:
            application/json:
              schema:
                type: object
                required: [refundAmount, feeAmount, currency, rule, hoursBeforeCheckIn]
                properties:
                  refundAmount:
                    type: number
                  feeAmount:
                    type: number
                  currency:
                    type: string
                    pattern: "^[A-Z]{3}$"
                  rule:
                    type: string
                  hoursBeforeCheckIn:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/proofs:
    post:
      operationId: uploadPaymentProof
      tags: [billing]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reservationNo, amount, currency, file]
              properties:
                reservationNo:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"
                note:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Proof received for review
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [pending]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File exceeds 5 MB
    get:
      operationId: listPaymentProofs
      tags: [billing]
      parameters:
        - name: reservationNo
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Payment proofs visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [proofs]
                properties:
                  proofs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentProof"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /payments/proofs/{id}/file:
    get:
      operationId: getPaymentProofFile
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Original PNG, JPEG, or PDF proof file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/proofs/{id}/review:
    put:
      operationId: reviewPaymentProof
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                note:
                  type: string
      responses:
        "200":
          description: Proof reviewed
          content:
            application/json:
              schema:
                type: object
                required: [proof]
                properties:
                  proof:
                    $ref: "#/components/schemas/PaymentProof"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    RoomTypeInput:
      type: object
      required: [name, maxOccupancy, nightlyRate]
      properties:
        name:
          type: string
        description:
          type: string
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 20
        nightlyRate:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          description: Defaults to the hotel currency (USD).
    RoomType:
      type: object
      required: [id, name, maxOccupancy, roomCount]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        maxOccupancy:
          type: integer
        nightlyRate:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        roomCount:
          type: integer
    Room:
      type: object
      required: [id, roomNumber, status, roomTypeId]
      properties:
        id:
          type: string
        roomNumber:
          type: string
        status:
          type: string
          enum: [available, maintenance]
        maintenanceFrom:
          type: string
          format: date
          nullable: true
        maintenanceTo:
          type: string
          format: date
          nullable: true
        maintenanceNote:
          type: string
          nullable: true
        roomTypeId:
          type: string
        roomTypeName:
          type: string
        maxOccupancy:
          type: integer
        nightlyRate:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        upcomingReservations:
          type: integer
    Availability:
      type: object
      required: [roomTypeId, available, nightlyRate, currency]
      properties:
        roomTypeId:
          type: string
        available:
          type: boolean
        nightlyRate:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    RoomHold:
      type: object
      required: [id, roomTypeId, checkIn, checkOut, status, expiresAt]
      properties:
        id:
          type: string
        roomTypeId:
          type: string
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        status:
          type: string
          enum: [held, confirmed, released, expired]
        expiresAt:
          type: string
          format: date-time

    GuestInput:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        address:
          type: string
        idDocument:
          type: string
        preferences:
          type: string
        loyaltyTier:
          type: string
          enum: [none, member, silver, gold, platinum]
        loyaltyNumber:
          type: string
        consent:
          type: boolean

    GuestRegistrationInput:
      allOf:
        - $ref: "#/components/schemas/GuestInput"
        - type: object
          required: [password]
          properties:
            password:
              type: string
              minLength: 8

    Guest:
      allOf:
        - $ref: "#/components/schemas/GuestInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string

    DepositResult:
      type: object
      required: [depositId, status, amount, currency]
      properties:
        depositId:
          type: string
        status:
          type: string
          enum: [authorized]
        amount:
          type: number
        currency:
          type: string

    RefundResult:
      type: object
      required: [refundId, depositId, status, amount, currency]
      properties:
        refundId:
          type: string
        depositId:
          type: string
        status:
          type: string
          enum: [refunded]
        amount:
          type: number
        currency:
          type: string

    PaymentProof:
      type: object
      required: [id, reservationNo, guestId, amount, currency, fileName, fileType, fileSize, status, createdAt]
      properties:
        id:
          type: string
        reservationNo:
          type: string
        guestId:
          type: string
        amount:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        note:
          type: [string, "null"]
        fileName:
          type: string
        fileType:
          type: string
          enum: [image/png, image/jpeg, application/pdf]
        fileSize:
          type: integer
          maximum: 5242880
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewedBy:
          type: [string, "null"]
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    Reservation:
      type: object
      required: [reservationNo, guestId, roomTypeId, checkIn, checkOut, totalAmount, depositAmount, depositHeld, currency, status]
      properties:
        reservationNo:
          type: string
        guestId:
          type: string
        roomTypeId:
          type: string
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
        totalAmount:
          type: number
        depositAmount:
          type: number
        depositHeld:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        status:
          type: string
          enum: [confirmed, cancelled]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    Unauthorized:
      description: User identity or credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"